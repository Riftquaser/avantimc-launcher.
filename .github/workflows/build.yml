name: Build Windows Launcher

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout EML Base
      uses: actions/checkout@v4
      with:
        repository: 'EML-Project/Electron-Minecraft-Launcher'

    - name: Overlay User Files
      uses: actions/checkout@v4
      with:
        path: 'user_files'

    - name: Copy Custom Assets
      run: |
        cp -f user_files/index.html . || true
        cp -f user_files/style.css . || true
        cp -f user_files/avantimc_logo.png . || true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Install dependencies
      run: npm install

    - name: Build Windows Executable
      run: npm run build -- --win
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AvantiMC-Launcher-Windows
        path: dist/*.exe
