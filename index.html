<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>AvantiMC Launcher</title>

</head>
<body>
  <div class="background-overlay"></div>

  </div>
  <script src="renderer.js"></script>
</body>
</html>
